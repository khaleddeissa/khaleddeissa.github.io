<svg xmlns="http://www.w3.org/2000/svg" width="800" height="674" viewBox="0 0 800 674" role="img" aria-labelledby="title desc">
<title id="title">Regression checks need a fresh execution</title><desc id="desc">A reviewed baseline and a fresh recording from changed application code are validated and compared. The Action writes a report and fails for differences or invalid artifacts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9ddfc5"/></marker></defs>
<rect width="800" height="674" rx="16" fill="#0e1416"/>
<g font-family="Inter, Arial, sans-serif" text-anchor="middle">
<text x="400" y="40" font-size="23" fill="#e7edef" font-weight="600">Regression checks need a fresh execution</text>
<text x="400" y="70" font-size="16" fill="#aabcc2" font-weight="400">Compare reviewed evidence with behavior from the code under test.</text>
<rect x="40" y="104" width="320" height="80" rx="10" fill="#192328" stroke="#3b5058"/><text x="200.0" y="133" font-size="18" fill="#e7edef" font-weight="600">Reviewed baseline</text><text x="200.0" y="158" font-size="16" fill="#aabcc2" font-weight="400">Commit an accepted recording</text>
<rect x="440" y="104" width="320" height="80" rx="10" fill="#192328" stroke="#3b5058"/><text x="600.0" y="133" font-size="18" fill="#e7edef" font-weight="600">Changed application</text><text x="600.0" y="158" font-size="16" fill="#aabcc2" font-weight="400">Run instrumented code / tests</text>
<path d="M200 184V216" fill="none" stroke="#9ddfc5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 184V216" fill="none" stroke="#9ddfc5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="218" width="320" height="72" rx="10" fill="#192328" stroke="#9ddfc5"/><text x="200.0" y="247" font-size="18" fill="#e7edef" font-weight="600">baseline.rfr</text><text x="200.0" y="272" font-size="16" fill="#aabcc2" font-weight="400">Expected recorded execution</text>
<rect x="440" y="218" width="320" height="72" rx="10" fill="#192328" stroke="#9ddfc5"/><text x="600.0" y="247" font-size="18" fill="#e7edef" font-weight="600">actual.rfr</text><text x="600.0" y="272" font-size="16" fill="#aabcc2" font-weight="400">Fresh recorded execution</text>
<path d="M200 290V323H330V351" fill="none" stroke="#9ddfc5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 290V323H470V351" fill="none" stroke="#9ddfc5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="170" y="353" width="460" height="103" rx="10" fill="#192328" stroke="#9ddfc5"/><text x="400.0" y="382" font-size="18" fill="#e7edef" font-weight="600">GitHub Action + Rust CLI</text><text x="400.0" y="407" font-size="16" fill="#aabcc2" font-weight="400">Validate both artifacts</text><text x="400.0" y="430" font-size="16" fill="#aabcc2" font-weight="400">Compare ordered event semantics</text>
<path d="M400 456V488" fill="none" stroke="#9ddfc5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="170" y="490" width="460" height="75" rx="10" fill="#192328" stroke="#3b5058"/><text x="400.0" y="519" font-size="18" fill="#e7edef" font-weight="600">refract-report.json</text><text x="400.0" y="544" font-size="16" fill="#aabcc2" font-weight="400">Event-level comparison results</text>
<path d="M280 565V589H210V607" fill="none" stroke="#9ddfc5" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M520 565V589H590V607" fill="none" stroke="#9ddfc5" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="609" width="340" height="45" rx="10" fill="#192328" stroke="#3b5058"/><text x="210.0" y="638" font-size="18" fill="#e7edef" font-weight="600">No differences: pass</text>
<rect x="420" y="609" width="340" height="45" rx="10" fill="#192328" stroke="#3b5058"/><text x="590.0" y="638" font-size="18" fill="#e7edef" font-weight="600">Differences / invalid input: fail</text>
</g></svg>
