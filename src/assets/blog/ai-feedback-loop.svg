<svg viewBox="0 0 700 620" xmlns="http://www.w3.org/2000/svg" font-family="'Space Grotesk','Inter',system-ui,sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a4aa"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="620" fill="#0e1416"/>

  <rect x="250" y="20" width="200" height="52" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
  <text x="350" y="52" text-anchor="middle" fill="#e7edef" font-size="14" font-weight="600">AI agent</text>

  <line x1="350" y1="72" x2="350" y2="100" stroke="#93a4aa" stroke-width="1.4" marker-end="url(#arrow4)"/>

  <rect x="210" y="100" width="280" height="52" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
  <text x="350" y="132" text-anchor="middle" fill="#e7edef" font-size="14" font-weight="600">Generates Terraform</text>

  <line x1="350" y1="152" x2="350" y2="180" stroke="#93a4aa" stroke-width="1.4" marker-end="url(#arrow4)"/>

  <rect x="210" y="180" width="280" height="52" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
  <text x="350" y="212" text-anchor="middle" fill="#e7edef" font-size="14" font-weight="600">Terraform plan</text>

  <line x1="350" y1="232" x2="350" y2="260" stroke="#93a4aa" stroke-width="1.4" marker-end="url(#arrow4)"/>

  <rect x="180" y="260" width="340" height="60" rx="6" fill="#1a2226" stroke="#e3a34b" stroke-width="1.5"/>
  <text x="350" y="296" text-anchor="middle" fill="#e3a34b" font-size="15" font-weight="600">infra-contract check</text>

  <!-- branches -->
  <line x1="350" y1="320" x2="350" y2="342" stroke="#93a4aa" stroke-width="1.4"/>
  <line x1="160" y1="342" x2="540" y2="342" stroke="#93a4aa" stroke-width="1.4"/>
  <line x1="160" y1="342" x2="160" y2="366" stroke="#93a4aa" stroke-width="1.4" marker-end="url(#arrow4)"/>
  <line x1="540" y1="342" x2="540" y2="366" stroke="#93a4aa" stroke-width="1.4" marker-end="url(#arrow4)"/>

  <rect x="55" y="366" width="210" height="52" rx="6" fill="#141c1f" stroke="#3f8f5f"/>
  <text x="160" y="398" text-anchor="middle" fill="#7fd39a" font-size="13.5" font-weight="600">Pass → PR / deployment</text>

  <rect x="435" y="366" width="210" height="52" rx="6" fill="#141c1f" stroke="#a4453f"/>
  <text x="540" y="398" text-anchor="middle" fill="#e08a84" font-size="13.5" font-weight="600">Violation found</text>

  <line x1="540" y1="418" x2="540" y2="446" stroke="#93a4aa" stroke-width="1.4" marker-end="url(#arrow4)"/>

  <rect x="435" y="446" width="210" height="52" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
  <text x="540" y="478" text-anchor="middle" fill="#e7edef" font-size="13.5" font-weight="600">explain</text>

  <line x1="540" y1="498" x2="540" y2="526" stroke="#93a4aa" stroke-width="1.4" marker-end="url(#arrow4)"/>

  <rect x="435" y="526" width="210" height="52" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
  <text x="540" y="558" text-anchor="middle" fill="#e7edef" font-size="13.5" font-weight="600">Agent revises code</text>

  <!-- loop back to plan -->
  <path d="M435,552 C300,552 220,400 210,236" fill="none" stroke="#93a4aa" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow4)"/>
  <text x="150" y="470" fill="#62747a" font-size="10.5">validate again</text>
</svg>