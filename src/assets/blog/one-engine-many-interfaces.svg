<svg viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg" font-family="'Space Grotesk','Inter',system-ui,sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a4aa"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="400" fill="#0e1416"/>

  <!-- core -->
  <rect x="28" y="150" width="220" height="100" rx="6" fill="#1a2226" stroke="#e3a34b" stroke-width="1.6"/>
  <text x="138" y="188" text-anchor="middle" fill="#e7edef" font-size="14.5" font-weight="600">Contract</text>
  <text x="138" y="208" text-anchor="middle" fill="#e7edef" font-size="14.5" font-weight="600">+ evaluation engine</text>
  <text x="138" y="232" text-anchor="middle" fill="#62747a" font-size="10.5">one source of truth</text>

  <!-- five interfaces -->
  <g font-size="13.5" fill="#e7edef" font-weight="600">
    <rect x="420" y="20"  width="252" height="46" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
    <text x="546" y="48" text-anchor="middle">CLI</text>

    <rect x="420" y="90"  width="252" height="46" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
    <text x="546" y="118" text-anchor="middle">Python API</text>

    <rect x="420" y="160" width="252" height="46" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
    <text x="546" y="188" text-anchor="middle">GitHub Action</text>

    <rect x="420" y="230" width="252" height="46" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
    <text x="546" y="258" text-anchor="middle">Docker image</text>

    <rect x="420" y="300" width="252" height="46" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
    <text x="546" y="328" text-anchor="middle">MCP server (AI agents)</text>
  </g>

  <!-- connectors -->
  <path d="M248,175 C330,175 330,43 418,43"   fill="none" stroke="#93a4aa" stroke-width="1.3" marker-end="url(#arrow3)"/>
  <path d="M248,190 C330,190 330,113 418,113" fill="none" stroke="#93a4aa" stroke-width="1.3" marker-end="url(#arrow3)"/>
  <path d="M248,200 C330,200 330,183 418,183" fill="none" stroke="#93a4aa" stroke-width="1.3" marker-end="url(#arrow3)"/>
  <path d="M248,210 C330,210 330,253 418,253" fill="none" stroke="#93a4aa" stroke-width="1.3" marker-end="url(#arrow3)"/>
  <path d="M248,225 C330,225 330,323 418,323" fill="none" stroke="#93a4aa" stroke-width="1.3" marker-end="url(#arrow3)"/>

  <text x="138" y="278" text-anchor="middle" fill="#62747a" font-size="10.5">interfaces are transports,</text>
  <text x="138" y="294" text-anchor="middle" fill="#62747a" font-size="10.5">not separate implementations</text>
</svg>