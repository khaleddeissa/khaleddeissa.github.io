<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" font-family="'Space Grotesk','Inter',system-ui,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a4aa"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="520" fill="#0e1416"/>

  <!-- Developer / AI agent -->
  <rect x="235" y="24" width="250" height="56" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
  <text x="360" y="47" text-anchor="middle" fill="#e7edef" font-size="15" font-weight="600">Developer or AI agent</text>
  <text x="360" y="66" text-anchor="middle" fill="#62747a" font-size="11">writes / generates infrastructure</text>

  <line x1="360" y1="80" x2="360" y2="112" stroke="#93a4aa" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Terraform change -->
  <rect x="205" y="112" width="310" height="56" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
  <text x="360" y="135" text-anchor="middle" fill="#e7edef" font-size="15" font-weight="600">Terraform / OpenTofu change</text>
  <text x="360" y="154" text-anchor="middle" fill="#62747a" font-size="11">a plan describing intended infrastructure</text>

  <line x1="360" y1="168" x2="360" y2="200" stroke="#93a4aa" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Contract engine -->
  <rect x="175" y="200" width="370" height="86" rx="6" fill="#1a2226" stroke="#b9843e" stroke-width="1.4"/>
  <text x="360" y="230" text-anchor="middle" fill="#e3a34b" font-size="12" letter-spacing="1" font-weight="600">INFRA-CONTRACT.YAML</text>
  <text x="360" y="253" text-anchor="middle" fill="#e7edef" font-size="15" font-weight="600">Policy engine</text>
  <text x="360" y="273" text-anchor="middle" fill="#62747a" font-size="11">evaluates the change against the contract</text>

  <!-- split -->
  <line x1="360" y1="286" x2="360" y2="306" stroke="#93a4aa" stroke-width="1.4"/>
  <line x1="200" y1="306" x2="520" y2="306" stroke="#93a4aa" stroke-width="1.4"/>
  <line x1="200" y1="306" x2="200" y2="330" stroke="#93a4aa" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="520" y1="306" x2="520" y2="330" stroke="#93a4aa" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- CLI / MCP -->
  <rect x="90" y="330" width="220" height="56" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
  <text x="200" y="355" text-anchor="middle" fill="#e7edef" font-size="14" font-weight="600">CLI / MCP</text>
  <text x="200" y="373" text-anchor="middle" fill="#62747a" font-size="10.5">humans and AI agents</text>

  <!-- CI gate -->
  <rect x="410" y="330" width="220" height="56" rx="6" fill="#141c1f" stroke="rgba(232,238,240,0.16)"/>
  <text x="520" y="355" text-anchor="middle" fill="#e7edef" font-size="14" font-weight="600">CI gate</text>
  <text x="520" y="373" text-anchor="middle" fill="#62747a" font-size="10.5">pull request / pipeline</text>

  <line x1="200" y1="386" x2="200" y2="408" stroke="#93a4aa" stroke-width="1.4"/>
  <line x1="520" y1="386" x2="520" y2="408" stroke="#93a4aa" stroke-width="1.4"/>
  <line x1="200" y1="408" x2="520" y2="408" stroke="#93a4aa" stroke-width="1.4"/>
  <line x1="360" y1="408" x2="360" y2="432" stroke="#93a4aa" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Decision -->
  <rect x="220" y="432" width="280" height="56" rx="6" fill="#1a2226" stroke="#e3a34b" stroke-width="1.6"/>
  <text x="360" y="456" text-anchor="middle" fill="#e7edef" font-size="14.5" font-weight="600">Deployment decision</text>
  <text x="360" y="475" text-anchor="middle" fill="#e3a34b" font-size="11">accept / reject, with a reason</text>
</svg>